name: Build (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_ROOT: C:\slade-vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Restore library cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-x64-windows-static-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-static-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git C:\slade-vcpkg
          C:\slade-vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\slade-vcpkg\vcpkg integrate install

      # Each library is installed separately so a failure names the culprit
      - name: Install libraries (slow the first time)
        shell: pwsh
        run: |
          $libs = @("zlib", "bzip2", "libpng", "freetype", "ftgl", "lua", "mpg123", "sfml", "libwebp", "wxwidgets[webview]")
          foreach ($lib in $libs) {
            C:\slade-vcpkg\vcpkg install --triplet x64-windows-static $lib *>&1 | Tee-Object -FilePath vcpkg_log.txt
            if ($LASTEXITCODE -ne 0) {
              $tail = (Get-Content vcpkg_log.txt | Select-Object -Last 40) -join '%0A'
              Write-Output "::error title=vcpkg install $lib failed::$tail"
              # Show the port's own build log if vcpkg names one
              $logs = Select-String -Path vcpkg_log.txt -Pattern '[A-Z]:\\[^ ]*\.log' -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -Unique -First 2
              foreach ($l in $logs) {
                if (Test-Path $l) {
                  $t = (Get-Content $l | Select-String -Pattern 'error' | Select-Object -Last 25) -join '%0A'
                  Write-Output "::error title=$(Split-Path $l -Leaf)::$t"
                }
              }
              exit 1
            }
          }

      - name: Save library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-x64-windows-static-${{ github.run_id }}

      # Uses SLADE's CMake setup (the msvc\*.vcxproj files are out of date)
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build SLADE
        shell: pwsh
        run: |
          # Fluidsynth isn't installed here; MIDI falls back to SLADE's other MIDI options
          # msvc-dev-cmd points VCPKG_ROOT at Visual Studio's bundled vcpkg; use ours
          $env:VCPKG_ROOT = "C:\slade-vcpkg"
          cmake --preset win-x64-release -DNO_FLUIDSYNTH=ON `
            -DCMAKE_TOOLCHAIN_FILE=C:/slade-vcpkg/scripts/buildsystems/vcpkg.cmake *>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -eq 0) {
            cmake --build out/build/win-x64-release *>&1 | Tee-Object -FilePath build_log.txt -Append
          }
          if ($LASTEXITCODE -ne 0) {
            $errs = Select-String -Path build_log.txt -Pattern '(: (fatal )?error |CMake Error|error LNK)' -Context 0,8 | Select-Object -First 30 | ForEach-Object { (@($_.Line.Trim()) + $_.Context.PostContext) -join '%0A' }
            $i = 0
            foreach ($e in $errs) { $i++; Write-Output "::error title=Build error $i::$e" }
            if ($i -eq 0) { Write-Output "::error title=Build failed::$((Get-Content build_log.txt | Select-Object -Last 40) -join '%0A')" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\SLADE.exe package\SLADE.exe
          # slade.pk3 is SLADE's resource archive (a zip of dist\res)
          Compress-Archive -Path dist\res\* -DestinationPath package\slade.zip -Force
          Move-Item package\slade.zip package\slade.pk3
          Get-ChildItem package

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SLADE-windows-x64
          path: package\
